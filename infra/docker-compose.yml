# =============================================================================
# JARVAS — full local/production-shaped stack
#
#   docker compose -f infra/docker-compose.yml --env-file .env up --build
#
# Services: postgres (pgvector) · redis · minio · api · worker · beat ·
#           web (Next.js) · nginx (single entrypoint on :8080)
# =============================================================================

name: jarvas

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jarvas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jarvas}
      POSTGRES_DB: ${POSTGRES_DB:-jarvas}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jarvas} -d ${POSTGRES_DB:-jarvas}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [jarvas]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [jarvas]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-jarvas}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-jarvas-secret}
    volumes:
      - miniodata:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [jarvas]

  # One-shot: create the uploads/results buckets, then exit.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set jarvas http://minio:9000 ${S3_ACCESS_KEY:-jarvas} ${S3_SECRET_KEY:-jarvas-secret} &&
      mc mb --ignore-existing jarvas/${S3_BUCKET_UPLOADS:-jarvas-uploads} &&
      mc mb --ignore-existing jarvas/${S3_BUCKET_RESULTS:-jarvas-results} &&
      mc anonymous set download jarvas/${S3_BUCKET_RESULTS:-jarvas-results} || true
      "
    networks: [jarvas]

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      JARVAS_ENV: ${JARVAS_ENV:-production}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jarvas}:${POSTGRES_PASSWORD:-jarvas}@postgres:5432/${POSTGRES_DB:-jarvas}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      BIOMETRIC_ENCRYPTION_KEY: ${BIOMETRIC_ENCRYPTION_KEY:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@jarvas.dev}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?set BOOTSTRAP_ADMIN_PASSWORD in .env}
      BOOTSTRAP_TENANT_NAME: ${BOOTSTRAP_TENANT_NAME:-JARVAS Demo Tenant}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-jarvas}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-jarvas-secret}
      S3_BUCKET_UPLOADS: ${S3_BUCKET_UPLOADS:-jarvas-uploads}
      S3_BUCKET_RESULTS: ${S3_BUCKET_RESULTS:-jarvas-results}
      FACE_DETECTION_MODEL: ${FACE_DETECTION_MODEL:-buffalo_sc}
      FACE_RECOGNITION_MODEL: ${FACE_RECOGNITION_MODEL:-buffalo_sc}
      FACE_PROVIDERS: ${FACE_PROVIDERS:-CPUExecutionProvider}
      MODEL_DIR: /models
      ALLOW_MOCK_FACE_ENGINE: ${ALLOW_MOCK_FACE_ENGINE:-true}
      DEFAULT_SIMILARITY_THRESHOLD: ${DEFAULT_SIMILARITY_THRESHOLD:-0.38}
      RECOGNITION_ENABLED: ${RECOGNITION_ENABLED:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8080}
    volumes:
      - models:/models
      - api_media:/app/data
    ports:
      - "${API_PORT:-8000}:8000"
    networks: [jarvas]

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["celery", "-A", "app.celery_app.celery_app", "worker", "-l", "info", "--concurrency", "2"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      JARVAS_ENV: ${JARVAS_ENV:-production}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jarvas}:${POSTGRES_PASSWORD:-jarvas}@postgres:5432/${POSTGRES_DB:-jarvas}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      BIOMETRIC_ENCRYPTION_KEY: ${BIOMETRIC_ENCRYPTION_KEY:-}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-jarvas}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-jarvas-secret}
      FACE_PROVIDERS: ${FACE_PROVIDERS:-CPUExecutionProvider}
      MODEL_DIR: /models
      ALLOW_MOCK_FACE_ENGINE: ${ALLOW_MOCK_FACE_ENGINE:-true}
    volumes:
      - models:/models
      - api_media:/app/data
    networks: [jarvas]

  beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["celery", "-A", "app.celery_app.celery_app", "beat", "-l", "info"]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    networks: [jarvas]

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      PORT: "3000"
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-3000}:3000"
    networks: [jarvas]

  # Optional single-entrypoint reverse proxy (frontend + API on one port).
  # Enable with: docker compose -f infra/docker-compose.yml --profile proxy up
  nginx:
    image: nginx:1.27-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    depends_on:
      - backend
      - web
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [jarvas]

volumes:
  pgdata:
  redisdata:
  miniodata:
  models:
  api_media:

networks:
  jarvas:
    driver: bridge
